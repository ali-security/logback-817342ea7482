dist: trusty

language: java

notifications:
  email:
      - notification@qos.ch

# seal: logback 1.5.x test-compiles logback-classic-blackbox against jetty-ee10 12
# (class file version 61), which JDK 11 cannot read; build with Temurin 21,
# the JDK upstream's own GitHub workflow uses.
before_install:
  - curl -fsSL -o /tmp/jdk21.tar.gz "https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jdk/hotspot/normal/eclipse"
  - mkdir -p $HOME/jdk21 && tar -xzf /tmp/jdk21.tar.gz -C $HOME/jdk21 --strip-components=1
  - export JAVA_HOME=$HOME/jdk21
  - export PATH=$JAVA_HOME/bin:$PATH
  - java -version
  - mvn -version

install: /bin/true

script:
  - mvn clean
  - mvn install
  - java .github/seal/SkipReport.java
cache:
  directories:
  - $HOME/.m2
