name: CI

on:
  workflow_dispatch:    # ← this enables manual runs
    inputs:
      test-filter:
        description: 'Optional surefire -Dtest selector; empty runs the full suite'
        required: false
        default: ''

  # Trigger on push to any branch
  #push:
  #  branches:
  #    - '*'

# https://help.github.com/en/actions/automating-your-workflow-with-github-actions/software-installed-on-github-hosted-runners

concurrency:
  # On master/release, we don't want any jobs cancelled so the sha is used to name the group
  # On PR branches, we cancel the job if new commits are pushed
  # More info: https://stackoverflow.com/a/68422069/253468
  group: ${{ (github.ref == 'refs/heads/branch_1.2.18' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release' ) && format('ci-main-{0}', github.sha) || format('ci-main-{0}', github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Test:
    name: JDK ${{ matrix.jdk }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      matrix:
        jdk: [21]
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: true
      max-parallel: 4
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 50
    - name: Set up Java ${{ matrix.jdk }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.jdk }}
        cache: maven  # This enables Maven dependency caching
    - name: Install
      # download dependencies, etc, so test log looks better
      shell: bash
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          mvn -B install -Dtest='${{ inputs.test-filter }}' -Dsurefire.failIfNoSpecifiedTests=false
        else
          mvn -B install
        fi
    - name: Test report (per-module counts and skipped tests with reasons)
      run: java .github/seal/SkipReport.java

  Package:
    name: Package logback-classic jars
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 50
    # the public jars were built from a CRLF checkout (text resources carry CRLF)
    - name: Re-checkout with CRLF line endings
      run: |
        git config core.eol crlf
        git rm -rq --cached .
        git reset -q --hard HEAD
    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 21
        cache: maven
    - name: Build jars (tests run in the Test job and on Travis)
      run: |
        mvn -B install -pl logback-classic -am -Dmaven.test.skip.exec=true
        # second pass mirrors the release's install-then-deploy (Originally-Created-By manifest header)
        mvn -B install -pl logback-classic -am -Dmaven.test.skip.exec=true
    - uses: actions/upload-artifact@v4
      with:
        name: logback-classic-jars
        path: |
          logback-classic/target/logback-classic-*.jar
          !logback-classic/target/logback-classic-*-sources.jar
          !logback-classic/target/logback-classic-*-javadoc.jar
        if-no-files-found: error


